name: Claude Review

# Reviews each pull request once with Purge's own review command,
# .claude/commands/review-pr.md, and posts comments (#147). It never pushes:
# it runs on this job's GITHUB_TOKEN, not the Claude GitHub App, so the
# read-only contents permission binds it (#145).

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  # Re-review a pull request from the Actions tab without closing it.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: number

concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # Forks get no secrets, and drafts are reviewed once they are ready.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      # The review rules in CLAUDE.md and .claude/ sit at the root and come
      # from main. A manual run takes them from the branch it was started on,
      # so changes to the review can be tried before they merge. The pull
      # request's code goes in pr-head/.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/pull/${{ github.event.pull_request.number || inputs.pr_number }}/head
          path: pr-head
          fetch-depth: 1
          persist-credentials: false

      # --add-dir loads skills and commands from pr-head/.claude, which would
      # let a pull request add instructions to its own review.
      - name: Drop the pull request's Claude config
        run: rm -rf pr-head/.claude

      - name: Review with Claude
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: /review-pr ${{ github.event.pull_request.number || inputs.pr_number }}
          claude_args: |
            --model claude-opus-5-5
            --add-dir pr-head
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Read,Grep,Glob,Write,Agent,mcp__github_inline_comment__create_inline_comment"

      # Claude's output is hidden in the log. This prints only the commands it
      # ran, the files it read, its errors, and its last message, so a review
      # that posts nothing can still be explained.
      - name: Trace
        if: always()
        run: |
          f="$RUNNER_TEMP/claude-execution-output.json"
          [ -f "$f" ] || exit 0
          jq -r '.[] |
            if .type == "assistant" then (.message.content[] | select(.type == "tool_use") | "CALL \(.name) \(.input.command // .input.file_path // .input.pattern // .input.description // "" | tostring | .[0:200])")
            elif .type == "user" then (.message.content[]? | select(type == "object" and .type == "tool_result" and .is_error == true) | "ERROR \(.content | tostring | .[0:300])")
            elif .type == "result" then "RESULT \(.result // "" | tostring | .[0:1500])"
            else empty end' "$f"
