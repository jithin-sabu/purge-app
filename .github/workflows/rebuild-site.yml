name: Rebuild purgemac.com

# purgemac.com builds its changelog, download link and /safety page from this
# repo's releases, so it has to rebuild whenever a release changes.
#
# /safety is generated from DeletionSafetyPolicy.swift, explanations.json and
# ProjectArtifactCatalog.swift at the release tag. Before the deploy hook fires,
# the site is built here from that tag, so a rename that the site's parser can't
# read fails this workflow instead of failing silently inside Cloudflare. After
# the hook fires, the live page is polled until it shows the new version.

on:
  release:
    types: [published, edited, deleted]

permissions:
  contents: read

jobs:
  verify:
    name: Build the site from this release
    # The site only lists full releases, and a deleted tag can't be checked out.
    if: ${{ !github.event.release.prerelease && github.event.action != 'deleted' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
          path: app

      - name: Check the site token can read purge-landing-page
        env:
          LANDING_REPO_TOKEN: ${{ secrets.LANDING_REPO_TOKEN }}
        run: |
          if [ -z "$LANDING_REPO_TOKEN" ]; then
            echo "::error::LANDING_REPO_TOKEN is not set. purge-landing-page is private, so this job needs a fine-grained token with read access to its contents."
            exit 1
          fi
          # Prints who the token belongs to and whether it can see the repo, so
          # a token scoped to the wrong account or repository fails here with
          # a reason instead of as "Not Found" inside actions/checkout.
          # purge-app is public, so this log is public: print only the token
          # kind, its login, classic scopes, and a repository count.
          case "$LANDING_REPO_TOKEN" in
            github_pat_*) KIND="fine-grained" ;;
            ghp_*) KIND="classic" ;;
            *) KIND="unrecognised prefix" ;;
          esac
          AUTH="Authorization: Bearer $LANDING_REPO_TOKEN"
          LOGIN=$(curl -sS --max-time 20 -H "$AUTH" https://api.github.com/user | jq -r '.login // "unknown"')
          SCOPES=$(curl -sS --max-time 20 -I -H "$AUTH" https://api.github.com/user | grep -i '^x-oauth-scopes:' | cut -d' ' -f2- | tr -d '\r')
          VISIBLE=$(curl -sS --max-time 20 -H "$AUTH" "https://api.github.com/user/repos?per_page=100&affiliation=owner" | jq 'if type=="array" then length else 0 end')
          STATUS=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -H "$AUTH" https://api.github.com/repos/jithin-sabu/purge-landing-page)
          echo "Token: $KIND, belongs to $LOGIN, classic scopes: [${SCOPES:-none}], can see $VISIBLE repositories you own."
          echo "GET /repos/jithin-sabu/purge-landing-page -> $STATUS"
          if [ "$STATUS" != "200" ]; then
            case "$KIND" in
              fine-grained) HINT="Under Repository access choose 'Only select repositories' and tick purge-landing-page, with Contents: Read-only." ;;
              classic) HINT="A classic token needs the full 'repo' scope to read a private repository." ;;
              *) HINT="Use a fine-grained token scoped to purge-landing-page with Contents: Read-only." ;;
            esac
            echo "::error::LANDING_REPO_TOKEN cannot read jithin-sabu/purge-landing-page (HTTP $STATUS). $HINT"
            exit 1
          fi

      - name: Check out purgemac.com
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: jithin-sabu/purge-landing-page
          token: ${{ secrets.LANDING_REPO_TOKEN }}
          path: site

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build /safety from the checked-out source
        working-directory: site
        env:
          SAFETY_SOURCE_DIR: ${{ github.workspace }}/app
          SAFETY_SOURCE_REF: ${{ github.event.release.tag_name }}
        run: npm run build

      - name: Confirm the page carries this version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: grep -Fq -- "As of $RELEASE_TAG" site/out/safety.html

  rebuild:
    name: Deploy and confirm
    needs: verify
    # Run on delete too, where verify is skipped on purpose.
    if: ${{ always() && !github.event.release.prerelease && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger the Cloudflare Pages deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.LANDING_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::LANDING_DEPLOY_HOOK is not set, so purgemac.com was not rebuilt."
            exit 1
          fi
          curl --fail-with-body -sS -X POST "$DEPLOY_HOOK"

      - name: Wait for purgemac.com/safety to show the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # After an edit or delete the latest release may not be this event's
          # tag, so ask the API what the site should now be showing.
          EXPECTED=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name)
          echo "Expecting purgemac.com/safety to show: As of $EXPECTED"
          for i in $(seq 1 40); do
            if curl -fsSL --max-time 20 "https://purgemac.com/safety?t=$(date +%s)" | grep -Fq -- "As of $EXPECTED"; then
              echo "purgemac.com/safety shows $EXPECTED"
              exit 0
            fi
            sleep 15
          done
          echo "::error::purgemac.com/safety still does not show $EXPECTED after 10 minutes. Check the Cloudflare Pages build log."
          exit 1
