name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Lint design tokens
        run: node scripts/lint-design-tokens.mjs

      - name: Check translations
        run: python3 scripts/check-localization.py

      - name: Build (unsigned)
        run: |
          xcodebuild clean build \
            -project purge.xcodeproj \
            -scheme purge \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        timeout-minutes: 20
        run: |
          # Temporary: record what a stuck test host is doing, then remove.
          (
            sleep 600
            echo "::group::Diagnostics after 10 minutes"
            ps -axo pid,etime,command | grep -i -E 'Purge|xctest|testmanager|xcodebuild' | grep -v grep
            for pid in $(pgrep -x Purge); do
              sudo sample "$pid" 3 -file "$RUNNER_TEMP/purge-$pid.txt" >/dev/null 2>&1
              head -n 200 "$RUNNER_TEMP/purge-$pid.txt"
            done
            log show --last 15m --style compact --predicate 'process == "tccd" OR process == "Purge"' 2>/dev/null | tail -n 80
            echo "::endgroup::"
          ) &
          diag=$!
          set +e
          xcodebuild test \
            -project purge.xcodeproj \
            -scheme purge \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          status=$?
          pkill -P "$diag" 2>/dev/null
          kill "$diag" 2>/dev/null
          exit $status
