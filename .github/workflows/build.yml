name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Lint design tokens
        run: node scripts/lint-design-tokens.mjs

      - name: Check translations
        run: python3 scripts/check-localization.py

      - name: Build (unsigned)
        run: |
          xcodebuild clean build \
            -project purge.xcodeproj \
            -scheme purge \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        timeout-minutes: 20
        run: |
          # These two suites deliberately exhaust Swift's worker pool. Run them
          # separately so unrelated async tests can finish before their deadlines.
          mkdir -p TestResults
          xcodebuild test \
            -project purge.xcodeproj \
            -scheme purge \
            -destination 'platform=macOS' \
            -skip-testing:PurgeTests/ProcessRunnerTests \
            -skip-testing:PurgeTests/FolderSizingConcurrencyTests \
            -resultBundlePath TestResults/UnitTests.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run process stress tests
        timeout-minutes: 10
        run: |
          xcodebuild test \
            -project purge.xcodeproj \
            -scheme purge \
            -destination 'platform=macOS' \
            -only-testing:PurgeTests/ProcessRunnerTests \
            -resultBundlePath TestResults/ProcessStressTests.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run folder sizing stress tests
        timeout-minutes: 10
        run: |
          xcodebuild test \
            -project purge.xcodeproj \
            -scheme purge \
            -destination 'platform=macOS' \
            -only-testing:PurgeTests/FolderSizingConcurrencyTests \
            -resultBundlePath TestResults/FolderSizingStressTests.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore
