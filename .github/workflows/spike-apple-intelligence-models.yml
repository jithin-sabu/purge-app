name: Spike – Apple Intelligence models

# Builds the standalone spike for #133 and runs its self-test, which touches
# nothing on the runner. Only runs when the spike changes; Purge.app's own
# build is in build.yml.

on:
  push:
    paths:
      - "spikes/apple-intelligence-models/**"
      - ".github/workflows/spike-apple-intelligence-models.yml"
  pull_request:
    paths:
      - "spikes/apple-intelligence-models/**"
      - ".github/workflows/spike-apple-intelligence-models.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: spikes/apple-intelligence-models
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Self-test (no system access)
        run: .build/release/aimodels selftest

      - name: Measure (read-only; shows whether the runner has any records)
        run: .build/release/aimodels measure --all --dump | head -200
