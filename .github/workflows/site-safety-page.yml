name: Site safety page

# purgemac.com/safety is generated from these files. Build it from this
# branch so a change the site can't read is caught on the pull request,
# not on release day.

on:
  pull_request:
    paths:
      - purge/Services/DeletionSafetyPolicy.swift
      - purge/Resources/explanations.json
      - purge/Models/ProjectArtifactCatalog.swift
      - .github/workflows/site-safety-page.yml
  push:
    branches: [main]
    paths:
      - purge/Services/DeletionSafetyPolicy.swift
      - purge/Resources/explanations.json
      - purge/Models/ProjectArtifactCatalog.swift
      - .github/workflows/site-safety-page.yml

permissions:
  contents: read

jobs:
  build:
    name: Build /safety from this branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: app

      - name: Check the site token can read purge-landing-page
        env:
          LANDING_REPO_TOKEN: ${{ secrets.LANDING_REPO_TOKEN }}
        run: |
          if [ -z "$LANDING_REPO_TOKEN" ]; then
            echo "::error::LANDING_REPO_TOKEN is not set. purge-landing-page is private, so this job needs a fine-grained token with read access to its contents."
            exit 1
          fi
          # Prints who the token belongs to and whether it can see the repo, so
          # a token scoped to the wrong account or repository fails here with
          # a reason instead of as "Not Found" inside actions/checkout.
          LOGIN=$(curl -sS --max-time 20 -H "Authorization: Bearer $LANDING_REPO_TOKEN" https://api.github.com/user | jq -r '.login // "unknown"')
          STATUS=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $LANDING_REPO_TOKEN" https://api.github.com/repos/jithin-sabu/purge-landing-page)
          echo "Token belongs to: $LOGIN. GET /repos/jithin-sabu/purge-landing-page -> $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::LANDING_REPO_TOKEN ($LOGIN) cannot read jithin-sabu/purge-landing-page (HTTP $STATUS). Give the token 'Only select repositories' access to purge-landing-page with Contents: Read-only."
            exit 1
          fi

      - name: Check out purgemac.com
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: jithin-sabu/purge-landing-page
          token: ${{ secrets.LANDING_REPO_TOKEN }}
          path: site

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        env:
          SAFETY_SOURCE_DIR: ${{ github.workspace }}/app
        run: npm run build
